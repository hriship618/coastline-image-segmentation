experiment:
  name: dinov3_convnext_tiny_5band

model:
  name: dinov3_convnext_tiny
  model_name: facebook/dinov3-convnext-tiny-pretrain-lvd1689m
  in_channels: 5
  num_classes: 2
  pretrained: true

training:
  optimizer: adamw
  backbone_learning_rate: 0.00001
  head_learning_rate: 0.001
  weight_decay: 0.0001
  ignore_index: 255
  epochs: 30

