[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coastlearn"
version = "0.1.0"
description = "A minimal, explainable shoreline segmentation project."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
data = [
    "matplotlib>=3.8",
    "rasterio>=1.3",
    "torch>=2.2",
]
ml = [
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "rasterio>=1.3",
    "segmentation-models-pytorch>=0.3.3",
    "timm>=1.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.45",
]

[tool.setuptools.packages.find]
where = ["src"]
